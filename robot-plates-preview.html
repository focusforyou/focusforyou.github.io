<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animasyonlu robot plakaları</title><link rel="stylesheet" href="social.css"><link rel="stylesheet" href="cosmetics.css?v=robots1"><link rel="stylesheet" href="workspace-performance.css?v=chat-avatar2"><link rel="stylesheet" href="chat-readability.css?v=mobile-chat1"><link rel="stylesheet" href="robot-plates.css?v=robot-plates2"><link rel="stylesheet" href="name-fonts.css"><style>:root{--tx:#edf2ff;--mu:#aab8d3}*{box-sizing:border-box}body{margin:0;padding:24px;background:#080d1d;color:var(--tx);font:16px system-ui}main{max-width:900px;margin:auto}h1{font-size:25px}.samples{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:24px 0}.identity{font-size:15px}#chatMessages{display:flex;flex-direction:column;max-height:420px;overflow:auto;gap:12px}.chat-message{position:relative;border:1px solid #ffffff20}h2{font-size:18px}p{line-height:1.6}.chat-avatar-fallback{color:#edf2ff}</style></head><body><main><h1>GIF robot isim plakaları</h1><p>Sabit uçlar, 38 px yükseklik ve kesintisiz orta alan.</p><div id="samples"></div><h2>Sohbet görünümü</h2><div id="chatMessages"></div></main><script src="social-model.js?v=robot-plates1"></script><script>
for(const [plate,label] of [['robot-gold','Altın robot'],['robot-silver','Gümüş robot'],['robot-duo','Robot ikilisi']]){
 const title=document.createElement('h2');title.textContent=label;const row=document.createElement('div');row.className='samples';
 for(const name of ['Efe','Uzun görünen isim']){const node=document.createElement('strong');node.textContent=name;SocialModel.decorate(node,{cosmetics:{plate},username:'efe'});row.append(node)}samples.append(title,row);
 const message=document.createElement('article');message.className='chat-message';const avatar=document.createElement('span');avatar.className='chat-avatar chat-avatar-fallback';avatar.textContent='E';const name=document.createElement('strong');name.textContent='Efe';SocialModel.decorate(name,{cosmetics:{plate,tag:'custom:KOMİTE BÜKÜCÜ'},username:'efe'});const time=document.createElement('small');time.textContent='22:06';const text=document.createElement('p');text.textContent='Animasyonlu plaka ismin arkasında kalır. Mesaj metni aşağıda rahatça okunur.';message.append(avatar,name,time,text);chatMessages.append(message);
}
</script></body></html>
