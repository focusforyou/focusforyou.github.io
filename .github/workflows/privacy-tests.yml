name: Privacy and deletion checks
on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'privacy-tests/**', 'push-worker/**', 'tests/**', '*.js', 'index.html', '.github/workflows/privacy-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: privacy-tests
      - run: node -e "require('node:fs').copyFileSync('../firestore.rules','firestore.rules')"
        working-directory: privacy-tests
      - run: npx firebase emulators:exec --only firestore --project demo-focus-deletion "node --test *.rules.test.cjs"
        working-directory: privacy-tests


