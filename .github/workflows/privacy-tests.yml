name: Privacy and deletion checks
on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'privacy-tests/**', '.github/workflows/privacy-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: privacy-tests
      - run: npx firebase emulators:exec --only firestore --project demo-focus-deletion "node --test deletion.rules.test.cjs"
        working-directory: privacy-tests
