<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil düzenleme önizlemesi</title><link rel="stylesheet" href="profile-crop.css?v=profile-save1"><link rel="stylesheet" href="profile-edit.css?v=profile-save1"><style>
*{box-sizing:border-box}body{margin:0;background:#070e21;color:#edf2ff;font:16px system-ui;padding:24px}button,input,select,textarea{font:inherit}button{cursor:pointer}.pill{padding:11px 20px;border:1px solid #abc1fa;border-radius:24px;background:#152440;color:inherit}dialog{background:#101b32;color:inherit;border:1px solid #415574;border-radius:22px;width:min(560px,94vw);padding:24px;max-height:90vh;overflow:auto}dialog::backdrop{background:#0009}label{display:grid;gap:9px;margin:20px 0}input,select,textarea{width:100%;border:1px solid #415574;border-radius:12px;background:#091327;color:inherit;padding:13px}.cover{height:110px;background:linear-gradient(110deg,#244557,#192749);border-radius:14px}.face{display:flex;gap:18px;align-items:center;margin:-30px 16px 0}.face img{width:86px;height:86px;border-radius:50%;border:5px solid #101b32;object-fit:cover}.face button{width:40px;height:40px;padding:0}.muted{color:#9caccb;font-size:13px}#demoStatus{margin:20px 0}.controls{display:flex;gap:12px;justify-content:space-between}.demo-save{background:#abc1fa;color:#101b32}@media(max-width:600px){dialog{padding:16px}}
</style><h1>Profil düzenleme</h1><p class="muted">Örnek profil. Gerçek hesabına veya bulut kayıtlarına dokunmaz.</p><button id="reopen" class="pill">Profili aç</button><div id="demoStatus"></div><dialog id="accountSheet"><div class="controls"><strong>Profilin</strong><button id="closeDemo" class="pill">Kapat ×</button></div><div id="profileControls"><div class="studio-layout"><div class="cover"></div><div class="face"><img id="profileAvatar" src="icon-192.png" alt="Örnek profil fotoğrafı"><button id="cropDemo" class="pill" aria-label="Fotoğrafı düzenle">✎</button><strong>Efe <small>@efe</small></strong></div><p class="muted">Kalem, örnek görseli kırpma ekranını açar.</p><label>Görünen adın<input id="profileName" value="Efe" maxlength="30"></label><label>Hangi sınava çalışıyorsun?<select id="examCategory"><option value="TUS">TUS</option><option value="YKS">YKS</option><option value="LGS">LGS</option><option value="other">Diğer</option></select></label><label>Kısa tanıtım<textarea id="showcaseBio" maxlength="160">Birlikte odaklan.</textarea></label><div hidden><input id="socialUsername" value="efe"><input id="nameFont" value="default"><input id="nameStyle" value="plain"><input id="avatarFrame" value="none"><input id="namePlate" value="none"><input id="profileTag" value="none"><input type="checkbox" id="showcaseHours"><div id="showcaseBadges"></div></div></div><p id="accountStatus" role="status"></p><button id="saveProfile" class="pill demo-save">Kaydet</button></div></dialog>
<script src="profile-crop.js?v=profile-save1"></script><script>
let saved={uid:'demo',name:'Efe',photo:'icon-192.png'},publicProfile={uid:'demo',username:'efe',exam:'TUS',cosmetics:{font:'default',nameStyle:'plain',frame:'none',plate:'none',tag:'none'},showcase:{bio:'Birlikte odaklan.',showHours:false,badges:[]}};
window.FocusAccount={profile:()=>({...saved}),discardProfileDraft(){profileAvatar.src=saved.photo;profileAvatar.hidden=false}};window.FocusSocial={uid:()=>saved.uid,getProfile:()=>publicProfile};window.FocusProfileStudio={banner:()=>'',refresh(){FocusProfileEditor.sync()},discard(){},cosmetics(){}};
reopen.onclick=()=>accountSheet.showModal();closeDemo.onclick=()=>accountSheet.close();
cropDemo.onclick=async()=>{try{const blob=await(await fetch('icon-192.png')).blob(),photo=await FocusAvatarCrop.open(new File([blob],'demo.png',{type:'image/png'}));if(photo){profileAvatar.src=photo;FocusProfileEditor.sync()}}catch(e){accountStatus.textContent=e.message}};
saveProfile.onclick=()=>{saved={...saved,name:profileName.value,photo:profileAvatar.src};publicProfile={...publicProfile,exam:examCategory.value,showcase:{bio:showcaseBio.value,showHours:false,badges:[]}};FocusProfileEditor.committed();accountSheet.close();demoStatus.textContent='Örnek profil kaydedildi.'};
addEventListener('DOMContentLoaded',()=>accountSheet.showModal());
</script><script src="profile-edit.js?v=profile-save1"></script></html>
